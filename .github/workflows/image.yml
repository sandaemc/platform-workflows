# Builds an app's production image for the platform (sandaemc/platform) and pushes it to
# GHCR, tagged with the commit SHA. Everything it needs comes from the app's platform.yml:
#   app                → the image label service=<app> (Kamal refuses images without it)
#   image.registry     → where it's pushed, e.g. ghcr.io/owner/name
#   image.tag_suffix   → appended to the SHA (optional)
#   image.platforms    → default linux/arm64 (the Mac mini zones)
#
# A second app in the same repo has its own manifest (e.g. gateway/platform.yml) and its own
# workflow passing `manifest:`; the build context defaults to the manifest's folder.
#
# Use it from the app repo (the job needs packages: write):
#   jobs:
#     image:
#       uses: sandaemc/platform-workflows/.github/workflows/image.yml@v1
#       permissions: { contents: read, packages: write }
#
# Where it runs: GitHub's arm64 runner, unless the `runner` input or the caller's PLATFORM_RUNNER
# variable (repo or organization) names a self-hosted runner's label. There the cache stays in the
# runner's own Docker instead of GitHub's cache. No build record is stored as an artifact on either
# (GitHub bills artifacts and caches as storage).
name: Image

on:
  workflow_call:
    inputs:
      manifest:
        description: Path of the app's manifest (e.g. gateway/platform.yml for a second app in the repo)
        type: string
        default: platform.yml
      context:
        description: Docker build context; default the manifest's folder (its Dockerfile is <context>/Dockerfile)
        type: string
        default: ''
      prebuild:
        description: Shell command run before the build (e.g. fetching release assets into the build context)
        type: string
        default: ''
      runner:
        description: Runner label; default the caller's PLATFORM_RUNNER variable, else GitHub's ubuntu-24.04-arm
        type: string
        default: ''
    secrets:
      prebuild_token:
        description: Exposed to the prebuild command as GH_TOKEN
        required: false
    outputs:
      tag:
        description: The image tag pushed (<sha><tag_suffix>)
        value: ${{ jobs.image.outputs.tag }}

jobs:
  image:
    # GitHub's runner is native arm64. An x86_64 self-hosted runner builds arm64 under QEMU (it must
    # have it registered), slower for native modules (node-gyp, .NET), made up for by its warm cache.
    runs-on: ${{ inputs.runner || vars.PLATFORM_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read platform.yml
        id: m
        env:
          MANIFEST: ${{ inputs.manifest }}
          CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          command -v yq >/dev/null || {   # a self-hosted runner may have it already
            arch="$(case "$(uname -m)" in x86_64) echo amd64;; *) echo arm64;; esac)"
            sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_$arch"
            sudo chmod +x /usr/local/bin/yq
          }
          [ -f "$MANIFEST" ] || { echo "::error::$MANIFEST not found: this workflow builds from the app's platform manifest"; exit 1; }
          app="$(yq -r '.app // ""' "$MANIFEST")"
          registry="$(yq -r '.image.registry // ""' "$MANIFEST")"
          suffix="$(yq -r '.image.tag_suffix // ""' "$MANIFEST")"
          platforms="$(yq -r '.image.platforms // "linux/arm64"' "$MANIFEST")"
          [ -n "$app" ] || { echo "::error file=$MANIFEST::app is required"; exit 1; }
          [ -n "$registry" ] || { echo "::error file=$MANIFEST::image.registry is required"; exit 1; }
          case "$registry" in *:*) echo "::error file=$MANIFEST::image.registry must not include a tag"; exit 1;; esac
          tag="${GITHUB_SHA}${suffix}"
          {
            echo "app=$app"
            echo "image=$registry:$tag"
            echo "tag=$tag"
            echo "platforms=$platforms"
            echo "cross=$([[ "$platforms" == *amd64* ]] && echo true || echo false)"
            echo "context=${CONTEXT:-$(dirname "$MANIFEST")}"
          } >> "$GITHUB_OUTPUT"
          echo "Building $registry:$tag for $platforms (service=$app)"

      - name: Prebuild
        if: inputs.prebuild != ''
        env:
          GH_TOKEN: ${{ secrets.prebuild_token }}
        run: ${{ inputs.prebuild }}

      # GitHub's runners need QEMU set up here; a self-hosted runner registers it at boot itself.
      - uses: docker/setup-qemu-action@v3
        if: steps.m.outputs.cross == 'true' && runner.environment == 'github-hosted'

      # On a self-hosted runner, build in its own Docker, whose cache is still there next time.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: ${{ runner.environment == 'self-hosted' && 'docker' || 'docker-container' }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false   # the build record artifact counts as Actions storage
        with:
          context: ${{ steps.m.outputs.context }}
          platforms: ${{ steps.m.outputs.platforms }}
          push: true
          tags: ${{ steps.m.outputs.image }}
          labels: service=${{ steps.m.outputs.app }}
          # GitHub's runners: one cache per app, so apps sharing this workflow don't evict each
          # other's layers. A self-hosted runner: none needed (the docker driver keeps its cache).
          cache-from: ${{ runner.environment == 'github-hosted' && format('type=gha,scope={0}', steps.m.outputs.app) || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && format('type=gha,mode=max,scope={0}', steps.m.outputs.app) || '' }}
